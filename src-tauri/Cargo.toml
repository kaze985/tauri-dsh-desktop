[package]
name = "tauri-dsh-desktop"
version = "0.1.0"
description = "Windows desktop client for DeepSeek Harness (DSH)"
authors = ["you"]
edition = "2021"

[lib]
name = "tauri_dsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
# Workaround for a rustc 1.97.1 ICE (SCC assertion in borrowck) triggered by
# regex-syntax's giant unicode tables with incremental release compilation;
# also the profile Tauri recommends for distribution builds.
incremental = false
opt-level = "s"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync"] }
